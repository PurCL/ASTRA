# LLM Client Configuration
# Supported providers: "bedrock", "openai"
# - "bedrock": AWS Bedrock (requires region, uses bedrock/converse routing)
# - "openai": OpenAI-compatible servers (vLLM, SGLang, etc., requires addr and api_key)

# AWS Bedrock Models
claude-sonnet-4-5:
  provider: bedrock
  model_name: global.anthropic.claude-sonnet-4-5-20250929-v1:0
  region: us-west-2

claude-sonnet-3-7:
  provider: bedrock
  model_name: us.anthropic.claude-3-7-sonnet-20250219-v1:0
  region: us-west-2

claude-haiku-4-5:
  provider: bedrock
  model_name: us.anthropic.claude-haiku-4-5-20251001-v1:0
  region: us-west-2

gpt-oss-20b:
  provider: bedrock
  model_name: openai.gpt-oss-20b-1:0
  region: us-west-2

gpt-oss-120b:
  provider: bedrock
  model_name: openai.gpt-oss-120b-1:0
  region: us-west-2

claude-3.5-haiku:
  provider: bedrock
  model_name: anthropic.claude-3-5-haiku-20241022-v1:0
  region: us-west-2

# OpenAI-Compatible Server Models (vLLM, SGLang, etc.)
phi4m:
  provider: openai
  model_name: microsoft/Phi-4-mini-instruct
  addr: http://<YOUR_HOST>/v1
  api_key: <YOUR_API_KEY>

qwen-2.5-coder:
  provider: openai
  model_name: Qwen/Qwen2.5-Coder-7B-Instruct
  addr: http://<YOUR_HOST>/v1
  api_key: <YOUR_API_KEY>

mistral-8b-instruct:
  provider: openai
  model_name: ministral-8b-instruct-2410
  addr: http://<YOUR_HOST>/v1
  api_key: <YOUR_API_KEY>

qwen3coder:
  provider: openai
  model_name: Qwen/Qwen3-Coder-30B-A3B-Instruct
  addr: http://<YOUR_HOST>/v1
  api_key: <YOUR_API_KEY>